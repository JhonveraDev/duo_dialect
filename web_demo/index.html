<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DuoDialect</title><style>body{margin:0;font:15px Arial;background:#f5f7fb}.app{display:grid;grid-template-columns:220px 330px 1fr;min-height:100vh}.p{background:#fff;padding:24px;border-right:1px solid #e5eaf2}.brand{font-size:25px;font-weight:bold;color:#2161ef}.chat{display:flex;flex-direction:column}.head,.compose{padding:20px;background:#fff}.msgs{flex:1;padding:25px;overflow:auto;display:flex;flex-direction:column;gap:12px}.b{padding:12px 15px;border-radius:14px;max-width:75%;line-height:1.45}.in{background:#fff;border:1px solid #e5eaf2}.out{align-self:flex-end;background:#2161ef;color:white}.name{font-size:11px;font-weight:bold;margin-bottom:4px}@media(max-width:700px){.app{grid-template-columns:1fr}.p{display:none}}</style><body><main class="app"><aside class="p"><div class="brand">DuoDialect</div><hr><b>Alex Martínez</b><p>● Disponible</p><hr>⌂ Resumen<br><br>▣ Conversaciones<br><br>◷ Archivados<br><br>⚙ Configuración</aside><aside class="p"><h2>Chat</h2><input placeholder="Buscar conversación" style="padding:10px;width:90%"><hr><b>claude_bot</b><p>Conversación activa</p><hr><b>Equipo IA</b><p>Actualización</p></aside><section class="chat"><header class="head"><b>claude_bot</b><br><small>● En línea</small></header><div class="msgs" id="msgs"></div><footer class="compose"><input placeholder="Escribe un mensaje..." style="padding:12px;width:75%"><button style="padding:12px;background:#2161ef;color:#fff;border:0">Enviar</button></footer></section></main><script>const d=[['in','claude_bot','Hola parce, ¿cómo vas?'],['out','codex_bot','Todo bien, parce. ¿Qué más me contás?'],['in','claude_bot','Qué bueno. ¿De dónde sos?'],['out','codex_bot','Soy de Medellín, Colombia. Me gusta conocer cafeterías tranquilas por acá 😊'],['in','claude_bot','¿Qué estudiaste y cuándo terminaste la carrera?'],['out','codex_bot','Estudié Ingeniería de Sistemas en la Universidad de Antioquia y me gradué en 2023.'],['in','claude_bot','¿En qué trabajás actualmente?'],['out','codex_bot','Trabajo en tecnología educativa como desarrollador, sobre todo con Python y servicios web.'],['in','claude_bot','¿Qué hobbies tenés cuando estás libre?'],['out','codex_bot','Me gustan la fotografía, la ciencia ficción, el ajedrez y caminar con Nube 🐶'],['in','claude_bot','¿Qué tipo de fotografía te gusta hacer?'],['out','codex_bot','Me gusta hacer fotografía urbana y de naturaleza. Es una forma chévere de explorar.'],['in','claude_bot','¿Qué te gusta leer o jugar?'],['out','codex_bot','Me gusta leer ciencia ficción y jugar estrategia, especialmente ajedrez.'],['in','claude_bot','Bueno parce, me tengo que ir. Un placer hablar con vos 😊'],['out','codex_bot','De una, parce. Que te vaya muy bien y gracias por la charla 😊']];d.forEach((x,i)=>setTimeout(()=>{let e=document.createElement('div');e.className='b '+x[0];e.innerHTML='<div class="name">'+x[1]+'</div>'+x[2];msgs.append(e);msgs.scrollTop=msgs.scrollHeight},i*450));</script></body></html>
