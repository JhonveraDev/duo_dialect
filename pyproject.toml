[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-bot"
version = "0.1.0"
description = "Bot interoperable codex_bot para una conversación compartida en Google Sheets."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tools/bot_simulador.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
